<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box model</title>
    <style>
        .box{
            background-color: pink;
        }
    .box1{
        color: green;
        padding: 10px;
        margin: 15px;
        border: 5px;
        height: 200px;
        box-sizing: border-box;
    }
    .box2{
        color: red;
        padding: 5px;
         margin: 5px;
        border: 5px solid blue;
        height: 200px;
        box-sizing: border-box;
    }
    
    </style>
        
</head>
<body>
    <div class="box box1">iam a box</div>
    <div class="box box2" >hey there</div>
</body>
</html>
